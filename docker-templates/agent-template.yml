version: '3.8'

# Template for OpenClaw AI Agent Containers
# Copy this file and customize for each agent.
# Keep this file public-safe: no literal secrets.

services:
  agent:
    image: ghcr.io/openclaw/openclaw:2026.3.2
    container_name: openclaw-{AGENT_NAME} # Replace: friday, arsenal, edith, jocasta
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -eu
        export NPM_CONFIG_PREFIX=/data/.tooling/npm-global
        export PATH="/data/.tooling/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        mkdir -p /data/.tooling/npm-global /data/.tooling
        python3 - <<'PY'
        from __future__ import annotations

        import base64
        import json
        import os
        from pathlib import Path


        def read_secret(name: str) -> str:
            direct = str(os.getenv(name, "")).strip()
            if direct:
                return direct
            from_file = str(os.getenv(f"{name}_FILE", "")).strip()
            if from_file:
                try:
                    return Path(from_file).read_text(encoding="utf-8").strip()
                except OSError:
                    return ""
            return ""


        def write_json_seed(name: str, targets: list[str]) -> None:
            encoded = read_secret(name)
            if not encoded:
                return
            try:
                payload = base64.b64decode(encoded).decode("utf-8")
            except Exception:
                return
            for target in targets:
                path = Path(target)
                path.parent.mkdir(parents=True, exist_ok=True)
                path.write_text(payload, encoding="utf-8")
                os.chmod(path, 0o600)


        runtime_home = Path(os.getenv("HOME") or "/tmp")
        write_json_seed(
            "CLAUDE_CREDENTIALS_JSON_B64",
            [
                "/data/.tooling/auth/claude.credentials.json",
                str(runtime_home / ".claude" / ".credentials.json"),
            ],
        )
        write_json_seed(
            "CODEX_AUTH_JSON_B64",
            [
                "/data/.tooling/auth/codex-auth.json",
                str(runtime_home / ".codex" / "auth.json"),
            ],
        )
        auth_targets = [
            Path("/data/.openclaw/agents/main/agent/auth-profiles.json"),
            Path("/data/.openclaw/agents/default/agent/auth-profiles.json"),
            Path("/data/.openclaw/auth-profiles.json"),
        ]

        profiles: dict[str, dict[str, str]] = {}
        for provider, env_name in {
            "anthropic": "ANTHROPIC_API_KEY",
            "openai": "OPENAI_API_KEY",
            "google": "GOOGLE_API_KEY",
            "nvidia": "NVIDIA_API_KEY",
        }.items():
            secret = read_secret(env_name)
            if secret:
                profiles[provider] = {"apiKey": secret}

        if profiles:
            payload = json.dumps(profiles, indent=2, sort_keys=True)
            for target in auth_targets:
                target.parent.mkdir(parents=True, exist_ok=True)
                target.write_text(payload, encoding="utf-8")
                os.chmod(target, 0o600)

        model_id = str(os.getenv("MODEL") or os.getenv("MODEL_PRIMARY") or "").strip()
        fallbacks_value = str(os.getenv("MODEL_FALLBACKS") or "").strip()
        fallback_models = [part.strip() for part in fallbacks_value.split(",") if part.strip()]
        container_tag = str(os.getenv("SUPERMEMORY_CONTAINER") or "").strip()
        config_path = Path("/data/.openclaw/openclaw.json")
        if config_path.exists() and (model_id or fallback_models or container_tag):
            try:
                data = json.loads(config_path.read_text(encoding="utf-8"))
            except Exception:
                data = None
            if isinstance(data, dict):
                changed = False
                for key in ("model", "defaultModel", "primaryModel"):
                    if data.pop(key, None) is not None:
                        changed = True

                agents = data.get("agents")
                if not isinstance(agents, dict):
                    agents = {}
                    data["agents"] = agents
                    changed = True
                defaults = agents.get("defaults")
                if not isinstance(defaults, dict):
                    defaults = {}
                    agents["defaults"] = defaults
                    changed = True
                model_obj = defaults.get("model")
                if not isinstance(model_obj, dict):
                    model_obj = {}
                    defaults["model"] = model_obj
                    changed = True
                if model_obj.get("primary") != model_id:
                    model_obj["primary"] = model_id
                    changed = True
                if model_obj.get("fallbacks") != fallback_models:
                    model_obj["fallbacks"] = fallback_models
                    changed = True

                tools = data.get("tools")
                if not isinstance(tools, dict):
                    tools = {}
                    data["tools"] = tools
                    changed = True
                if tools.get("profile") != "coding":
                    tools["profile"] = "coding"
                    changed = True

                if container_tag:
                    memory = data.get("memory")
                    if not isinstance(memory, dict):
                        memory = {}
                        data["memory"] = memory
                        changed = True
                    if memory.get("backend") != "supermemory":
                        memory["backend"] = "supermemory"
                        changed = True
                    if memory.get("citations") != "auto":
                        memory["citations"] = "auto"
                        changed = True
                    supermemory = memory.get("supermemory")
                    if not isinstance(supermemory, dict):
                        supermemory = {}
                        memory["supermemory"] = supermemory
                        changed = True
                    if supermemory.get("containerTag") != container_tag:
                        supermemory["containerTag"] = container_tag
                        changed = True

                if changed:
                    config_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
        PY
        if command -v npm >/dev/null 2>&1; then
          command -v claude >/dev/null 2>&1 || npm -g install @anthropic-ai/claude-code >>/data/.tooling/cli-bootstrap.log 2>&1
          command -v codex >/dev/null 2>&1 || npm -g install @openai/codex >>/data/.tooling/cli-bootstrap.log 2>&1
          command -v gemini >/dev/null 2>&1 || npm -g install @google/gemini-cli >>/data/.tooling/cli-bootstrap.log 2>&1
          command -v claude >/dev/null 2>&1 && chmod 755 "$$(command -v claude)" || true
          command -v codex >/dev/null 2>&1 && chmod 755 "$$(command -v codex)" || true
          command -v gemini >/dev/null 2>&1 && chmod 755 "$$(command -v gemini)" || true
        fi
        python3 - <<'PY'
        from __future__ import annotations

        import os
        import shutil
        from pathlib import Path

        codex_bin = shutil.which("codex")
        if codex_bin:
            wrapper_path = Path(codex_bin)
            real_path = wrapper_path.with_name("codex-real")
            if not real_path.exists():
                wrapper_path.rename(real_path)
                wrapper_script = """#!/usr/bin/env bash
        set -eu
        real_bin="$$(dirname "$$0")/codex-real"
        args=()
        for arg in "$$@"; do
          case "$$arg" in
            --color|--color=*)
              continue
              ;;
          esac
          args+=("$$arg")
        done
        exec "$${real_bin}" "$${args[@]}"
        """
                wrapper_path.write_text(wrapper_script, encoding="utf-8")
                os.chmod(wrapper_path, 0o755)
                os.chmod(real_path, 0o755)
        PY
        exec node dist/index.js gateway --bind "$${OPENCLAW_GATEWAY_BIND:-lan}" --port "$${PORT:-18789}"
    labels:
      com.kr8tiv.watchdog: "enabled"
      com.kr8tiv.recovery-window-seconds: "120"

    environment:
      # Agent identity
      AGENT_ROLE: ${AGENT_ROLE}
      AGENT_NAME: ${AGENT_NAME}

      # Model policy (lock routes, no runtime drift)
      MODEL_PRIMARY: ${MODEL_PRIMARY}
      MODEL_FALLBACKS: ${MODEL_FALLBACKS:-}
      MODEL_LOCK_ROUTES: ${MODEL_LOCK_ROUTES:-true}
      MODEL_ALLOW_RUNTIME_OVERRIDE: ${MODEL_ALLOW_RUNTIME_OVERRIDE:-false}
      PROVIDER_AFFINITY: ${PROVIDER_AFFINITY}

      # Communication
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Secrets via files only
      OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/openclaw_gateway_token
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
      NVIDIA_API_KEY_FILE: /run/secrets/nvidia_api_key
      SUPERMEMORY_API_KEY_FILE: /run/secrets/supermemory_api_key
      SUPERMEMORY_CONTAINER: ${SUPERMEMORY_CONTAINER}
      CLAUDE_CREDENTIALS_JSON_B64: ${CLAUDE_CREDENTIALS_JSON_B64:-}
      CLAUDE_CREDENTIALS_JSON_B64_FILE: ${CLAUDE_CREDENTIALS_JSON_B64_FILE:-}
      CODEX_AUTH_JSON_B64: ${CODEX_AUTH_JSON_B64:-}
      CODEX_AUTH_JSON_B64_FILE: ${CODEX_AUTH_JSON_B64_FILE:-}
      NPM_CONFIG_PREFIX: /data/.tooling/npm-global
      PATH: /data/.tooling/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    secrets:
      - openclaw_gateway_token
      - telegram_bot_token
      - anthropic_api_key
      - openai_api_key
      - google_api_key
      - nvidia_api_key
      - supermemory_api_key

    volumes:
      - ./data:/data
      - ./workspace:/workspace

    ports:
      - "${PORT}:48650" # Customize port per agent

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48650/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - agent-network

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  agent-network:
    driver: bridge

secrets:
  openclaw_gateway_token:
    file: ./secrets/openclaw_gateway_token.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  google_api_key:
    file: ./secrets/google_api_key.txt
  nvidia_api_key:
    file: ./secrets/nvidia_api_key.txt
  supermemory_api_key:
    file: ./secrets/supermemory_api_key.txt
